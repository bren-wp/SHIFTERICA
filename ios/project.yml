name: Raspored
options:
  bundleIdPrefix: hr.raspored
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 1.2.3
    CURRENT_PROJECT_VERSION: 6
    PRODUCT_BUNDLE_IDENTIFIER: hr.raspored.app
    INFOPLIST_KEY_CFBundleDisplayName: Raspored
targets:
  Raspored:
    type: application
    platform: iOS
    sources:
      - path: Raspored
    preBuildScripts:
      - name: Generate App Icon
        script: |
          xcrun swift "$SRCROOT/generate_app_icon.swift" "$SRCROOT/Raspored/Assets.xcassets/AppIcon.appiconset/Raspored-AppIcon-1024.png"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Raspored
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Raspored/Info.plist
      properties:
        CFBundleDisplayName: Raspored
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
