name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Full dead-code and maintenance audit
        working-directory: .
        shell: bash
        run: bash scripts/dead-code-audit.sh
      - name: Build APK and AAB
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace
      - name: Package Android artifacts
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p dist
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/debug/app-debug.aab
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Raspored-${VERSION}-debug.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "dist/Raspored-${VERSION}-debug.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: shifterica-android
          path: android/dist/*
          if-no-files-found: error

  ios:
    name: iOS builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate App Icon
        run: xcrun --sdk macosx swift ios/generate_app_icon.swift ios/Raspored/Assets.xcassets/AppIcon.appiconset/Raspored-AppIcon-1024.png
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build for Simulator
        run: >
          xcodebuild
          -project ios/Raspored.xcodeproj
          -scheme Raspored
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath ios/build-simulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Capture real app screenshots
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          APP="ios/build-simulator/Build/Products/Debug-iphonesimulator/Raspored.app"
          test -d "$APP"

          python3 - "$APP" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import time

          app = sys.argv[1]
          bundle_id = "hr.raspored.app"
          screens = ("month", "year", "summary", "settings", "shifts", "new-shift", "splash")
          output_dir = pathlib.Path("ios/documentation-screenshots")
          output_dir.mkdir(parents=True, exist_ok=True)

          def run(args, timeout=30, check=True):
              print("+", " ".join(args), flush=True)
              return subprocess.run(
                  args,
                  check=check,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )

          payload = json.loads(
              run(["xcrun", "simctl", "list", "devices", "available", "-j"], timeout=20).stdout
          )
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append(device)

          if not candidates:
              raise SystemExit("No available iPhone Simulator found")

          preferred = next(
              (d for d in candidates if "Pro" in d.get("name", "")),
              candidates[0],
          )
          udid = preferred["udid"]
          print(f"Using simulator: {preferred.get('name')} ({udid})", flush=True)

          try:
              run(["xcrun", "simctl", "boot", udid], timeout=30)
          except subprocess.CalledProcessError:
              pass

          # GitHub macOS runners occasionally need well over 90 seconds for a
          # freshly selected iOS 26 simulator. Poll CoreSimulator state instead
          # of letting simctl bootstatus block the whole screenshot job.
          deadline = time.time() + 210
          while True:
              state_payload = json.loads(
                  run(["xcrun", "simctl", "list", "devices", "-j"], timeout=20).stdout
              )
              state = None
              for devices in state_payload.get("devices", {}).values():
                  for device in devices:
                      if device.get("udid") == udid:
                          state = device.get("state")
                          break
                  if state is not None:
                      break
              print(f"Simulator state: {state}", flush=True)
              if state == "Booted":
                  break
              if time.time() >= deadline:
                  raise SystemExit("Simulator did not reach Booted state within 210 seconds")
              time.sleep(5)

          run(["xcrun", "simctl", "install", udid, app], timeout=45)

          try:
              run(
                  [
                      "xcrun", "simctl", "status_bar", udid, "override",
                      "--time", "09:41",
                      "--batteryState", "charged",
                      "--batteryLevel", "100",
                      "--wifiBars", "3",
                      "--cellularBars", "4",
                  ],
                  timeout=15,
              )
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
              print("Status bar override skipped.", flush=True)

          for screen in screens:
              run(["xcrun", "simctl", "terminate", udid, bundle_id], timeout=10, check=False)
              run(
                  [
                      "xcrun", "simctl", "launch", udid, bundle_id,
                      "--documentation-screen", screen,
                  ],
                  timeout=20,
              )
              time.sleep(1.5)

              destination = output_dir / f"{screen}.png"
              captured = False
              for attempt in range(1, 4):
                  try:
                      run(
                          [
                              "xcrun", "simctl", "io", udid, "screenshot",
                              "--type=png", str(destination),
                          ],
                          timeout=20,
                      )
                      if destination.is_file() and destination.stat().st_size > 0:
                          captured = True
                          break
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                      print(f"Screenshot attempt {attempt} failed for {screen}: {exc}", flush=True)
                  time.sleep(1)

              if not captured:
                  raise SystemExit(f"Could not capture {screen} screenshot")

          for required in ("month", "year", "settings"):
              path = output_dir / f"{required}.png"
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing required screenshot: {path}")

          run(["xcrun", "simctl", "shutdown", udid], timeout=20, check=False)
          PY
      - name: Upload real app screenshots
        uses: actions/upload-artifact@v4
        with:
          name: raspored-real-screenshots
          path: ios/documentation-screenshots/*.png
          if-no-files-found: error
      - name: Archive for iOS device without signing
        run: >
          xcodebuild
          -project ios/Raspored.xcodeproj
          -scheme Raspored
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath ios/build-device/Raspored.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive
      - name: Package iOS artifacts
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SIM_APP="ios/build-simulator/Build/Products/Debug-iphonesimulator/Raspored.app"
          ARCHIVE="ios/build-device/Raspored.xcarchive"
          DEVICE_APP="$ARCHIVE/Products/Applications/Raspored.app"
          test -d "$SIM_APP"
          test -d "$ARCHIVE"
          test -d "$DEVICE_APP"
          mkdir -p ios/dist/Payload
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" "ios/dist/Raspored-${VERSION}-Simulator.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" "ios/dist/Raspored-${VERSION}-unsigned.xcarchive.zip"
          ditto "$DEVICE_APP" ios/dist/Payload/Raspored.app
          (cd ios/dist && zip -qry "Raspored-${VERSION}-unsigned.ipa" Payload)
          rm -rf ios/dist/Payload
      - uses: actions/upload-artifact@v4
        with:
          name: shifterica-ios
          path: ios/dist/*
          if-no-files-found: error
      - name: Sync real screenshots into repository
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/raspored-screenshots

          for SCREEN in month year summary settings shifts new-shift splash; do
            SOURCE="ios/documentation-screenshots/$SCREEN.png"
            TARGET="/tmp/raspored-screenshots/$SCREEN.png"
            test -s "$SOURCE"
            sips --resampleWidth 720 "$SOURCE" --out "$TARGET" >/dev/null
            test -s "$TARGET"
          done

          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          mkdir -p docs/screenshots
          cp /tmp/raspored-screenshots/*.png docs/screenshots/
          git add docs/screenshots

          if git diff --cached --quiet; then
            echo "Real app screenshots are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh real app screenshots"
          git push origin HEAD:"$HEAD_REF"

  release:
    name: GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"

          cat > release-notes.md <<EOF
          SHIFTERICA / Raspored $TAG

          1:1 Android/iOS izdanje prema referentnim ekranima.

          Sadržaj izdanja:
          - Android APK za instalaciju i QA
          - Android AAB za bundle QA
          - iOS Simulator .app ZIP
          - iOS uređajni unsigned .xcarchive ZIP
          - iOS unsigned .ipa paket

          Napomena: iOS fizički uređaj i App Store zahtijevaju Apple Distribution certifikat/provisioning profile. Unsigned IPA i XCArchive služe za daljnje potpisivanje i distribucijski pipeline.
          EOF

          ASSETS=(
            release-artifacts/shifterica-android/*
            release-artifacts/shifterica-ios/*
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Raspored $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Raspored $TAG" --notes-file release-notes.md
          fi
