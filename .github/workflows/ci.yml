name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Full dead-code and maintenance audit
        working-directory: .
        shell: bash
        run: bash scripts/dead-code-audit.sh
      - name: Upload full source audit inventory
        uses: actions/upload-artifact@v4
        with:
          name: shifterica-full-source-audit
          path: build/reports/full-source-audit.json
          if-no-files-found: error
      - name: UI theme parity and contrast regression
        working-directory: .
        run: python3 scripts/verify-ui-palette.py
      - name: Independent calendar UI parity and payroll isolation
        working-directory: .
        run: python3 scripts/verify-universal-parity.py
      - name: Full shared-screen, button, icon and layout parity
        working-directory: .
        run: python3 scripts/verify-ui-detail-parity.py
      - name: Upload visual source parity inventory
        uses: actions/upload-artifact@v4
        with:
          name: shifterica-visual-source-parity
          path: build/reports/ui-source-parity.json
          if-no-files-found: error
      - name: Build APK and AAB
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace
      - name: Validate size-optimized Android release build
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Package Android artifacts
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p dist
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/debug/app-debug.aab
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Raspored-${VERSION}-debug.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "dist/Raspored-${VERSION}-debug.aab"
      - name: Universal calendar Android tests and lint
        working-directory: kalendar/android
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Build universal calendar APK and AAB
        working-directory: kalendar/android
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace
      - name: Validate size-optimized calendar release build
        working-directory: kalendar/android
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Package universal calendar Android assets
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          APK="kalendar/android/app/build/outputs/apk/debug/app-debug.apk"
          AAB="kalendar/android/app/build/outputs/bundle/debug/app-debug.aab"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" "android/dist/Raspored_app-${VERSION}-debug.apk"
          cp "$AAB" "android/dist/Raspored_app-${VERSION}-debug.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: shifterica-android
          path: android/dist/*
          if-no-files-found: error

  ios:
    name: iOS builds
    # Current App Store uploads require Xcode 26 and the iOS 26 SDK.
    # Keep simulator launch and screenshot verification mandatory.
    # CoreSimulator freezes on both macos-26 ARM and macos-26-intel:
    # simctl bootstatus, boot, and even create timed out on fresh CI hosts.
    # macOS 15 hosts a separate supported iOS 26 simulator environment;
    # Xcode 26.3 / iOS 26 SDK remain App Store compliant.
    # Keep launch and genuine screenshot gates mandatory.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify current App Store SDK
        shell: bash
        run: |
          set -euo pipefail
          # Never pipe xcodebuild into grep -q: early pipe closure crashes Xcode.
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if [[ "$xcode_version" != Xcode\ 26* ]]; then
            echo "Required Xcode 26 is not selected" >&2
            exit 1
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iPhoneOS SDK %s\n' "$sdk_version"
          if [[ "${sdk_version%%.*}" != "26" ]]; then
            echo "Required iPhoneOS 26 SDK is unavailable" >&2
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: iOS reminder plan regression checks
        shell: bash
        run: |
          set -euo pipefail
          swiftc ios/Raspored/DateSupport.swift ios/Raspored/ShiftReminderPlan.swift ios/Raspored/ShiftBackupTimeRules.swift ios/Raspored/ShiftDeletionPolicy.swift ios/Raspored/ShiftUsageNavigator.swift ios/Raspored/ScheduleSearch.swift ios/tests/main.swift -o "${RUNNER_TEMP}/raspored-reminder-tests"
          "${RUNNER_TEMP}/raspored-reminder-tests"
      - name: iOS payroll regression checks
        shell: bash
        run: |
          set -euo pipefail
          swiftc ios/Raspored/DateSupport.swift ios/Raspored/WorkTimeSummary.swift ios/Raspored/PayrollRules.swift ios/Raspored/PayrollEstimator.swift ios/tests/payroll-main.swift -o "${RUNNER_TEMP}/raspored-payroll-tests"
          "${RUNNER_TEMP}/raspored-payroll-tests"
      - name: iOS daylight-saving and shift-premium regression checks
        shell: bash
        run: |
          set -euo pipefail
          swiftc ios/Raspored/DateSupport.swift ios/Raspored/ShiftTimeIntervals.swift ios/tests/shift-time-main.swift -o "${RUNNER_TEMP}/raspored-shift-time-tests"
          "${RUNNER_TEMP}/raspored-shift-time-tests"
      - name: Verify month grid date alignment for both iOS applications
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library ios/Raspored/CalendarGridDates.swift ios/tests/calendar-grid-main.swift -o "${RUNNER_TEMP}/raspored-calendar-grid-tests"
          "${RUNNER_TEMP}/raspored-calendar-grid-tests"
          swiftc -parse-as-library kalendar/ios/RasporedApp/CalendarGridDates.swift ios/tests/calendar-grid-main.swift -o "${RUNNER_TEMP}/kalendar-calendar-grid-tests"
          "${RUNNER_TEMP}/kalendar-calendar-grid-tests"
      - name: Generate App Icon
        run: xcrun --sdk macosx swift ios/generate_app_icon.swift ios/Raspored/Assets.xcassets/AppIcon.appiconset/Raspored-AppIcon-1024.png
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build for Simulator
        run: >
          xcodebuild
          -project ios/Raspored.xcodeproj
          -scheme Raspored
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath ios/build-simulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compile real screenshot content validator
        shell: bash
        run: swiftc -O scripts/verify-ios-real-screenshot.swift -o "$RUNNER_TEMP/verify-ios-real-screenshot"
      - name: Capture real app screenshots
        id: capture_screenshots
        # Screenshots are part of required QA; surface failures instead of silently passing.
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          APP="ios/build-simulator/Build/Products/Debug-iphonesimulator/Raspored.app"
          test -d "$APP"

          python3 - "$APP" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import time

          validator = os.path.join(os.environ["RUNNER_TEMP"], "verify-ios-real-screenshot")
          app = sys.argv[1]
          bundle_id = "hr.raspored.app"
          screens = ("month", "year", "summary", "settings", "shifts",
                     "new-shift", "search", "day-picker", "splash")
          output_dir = pathlib.Path("ios/documentation-screenshots")
          output_dir.mkdir(parents=True, exist_ok=True)

          def run(args, timeout=30, check=True):
              print("+", " ".join(args), flush=True)
              return subprocess.run(
                  args,
                  check=check,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )

          runtimes_payload = json.loads(
              run(["xcrun", "simctl", "list", "runtimes", "available", "-j"], timeout=20).stdout
          )
          runtimes = [
              item for item in runtimes_payload.get("runtimes", [])
              if item.get("isAvailable") and item.get("name", "").startswith("iOS ")
          ]
          if not runtimes:
              raise SystemExit("No available iOS Simulator runtime found")

          def version_tuple(item):
              value = item.get("version", "0")
              return tuple(int(part) if part.isdigit() else 0 for part in value.split("."))

          # Only choose compatible iOS 26 runtimes for this Xcode 26 runner.
          compatible_runtimes = [
              item for item in runtimes if version_tuple(item)[:1] == (26,)
          ]
          if not compatible_runtimes:
              raise SystemExit("Xcode 26 requires an available iOS 26 simulator")
          runtime = max(compatible_runtimes, key=version_tuple)

          types_payload = json.loads(
              run(["xcrun", "simctl", "list", "devicetypes", "-j"], timeout=20).stdout
          )
          iphone_types = [
              item for item in types_payload.get("devicetypes", [])
              if item.get("name", "").startswith("iPhone")
          ]
          if not iphone_types:
              raise SystemExit("No iPhone Simulator device type found")

          # Exact cross-app screenshots must use one identical simulator model.
          preferred_names = ("iPhone 17 Pro",)

          by_name = {item.get("name"): item for item in iphone_types}
          if "iPhone 17 Pro" not in by_name:
              raise SystemExit("iPhone 17 Pro is required for pixel parity")
          candidates = [by_name["iPhone 17 Pro"]]

          # GitHub hosted macOS images may include already-prepared simulator
          # devices. Prefer one over a freshly-created cold device.
          existing_payload = json.loads(
              run(["xcrun", "simctl", "list", "devices", "available", "-j"], timeout=25).stdout
          )
          existing_devices = [
              item
              for key, devices in existing_payload.get("devices", {}).items()
              if key == runtime["identifier"]
              for item in devices
              if item.get("isAvailable", True) and
                 item.get("name") in preferred_names and item.get("udid")
          ]
          rank = {name: idx for idx, name in enumerate(preferred_names)}
          existing_devices.sort(
              key=lambda item: (
                  item.get("state") != "Booted",
                  rank.get(item.get("name"), 999),
              )
          )
          print(
              "Available existing iPhone devices: " +
              ", ".join(item["name"] for item in existing_devices[:5]),
              flush=True,
          )

          udid = None
          created_udids = set()
          boot_errors = []
          candidate_specs = [
              (item["udid"], item["name"], item.get("state") == "Booted")
              for item in existing_devices[:2]
          ]

          # Fall back to a dedicated device only when no installed simulator
          # is compatible. Creating every candidate anew caused cold boot stalls.
          if not candidate_specs:
              device_type = candidates[0]
              candidate_udid = run(
                  [
                      "xcrun", "simctl", "create", "RasporedDocs",
                      device_type["identifier"], runtime["identifier"],
                  ],
                  timeout=35,
              ).stdout.strip()
              if not candidate_udid:
                  raise SystemExit("Could not create an iOS Simulator")
              created_udids.add(candidate_udid)
              candidate_specs.append((candidate_udid, device_type["name"], False))

          def prepare_simulator(spec, wait_seconds=145):
              candidate_udid, candidate_name, already_booted = spec
              try:
                  print(f"Preparing simulator: {candidate_name} ({candidate_udid})", flush=True)
                  if not already_booted:
                      run(["xcrun", "simctl", "boot", candidate_udid], timeout=55)
                  run(
                      ["xcrun", "simctl", "bootstatus", candidate_udid, "-b"],
                      timeout=wait_seconds,
                  )
                  return candidate_udid
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                  boot_errors.append(f"{candidate_name}: {type(exc).__name__}: {exc}")
                  print(f"Simulator did not finish boot: {candidate_name}: {exc}", flush=True)
                  # Shutdown can also stall on degraded runners. Treat it only
                  # as best-effort cleanup, never as a successful QA result.
                  try:
                      run(
                          ["xcrun", "simctl", "shutdown", candidate_udid],
                          timeout=12, check=False,
                      )
                  except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as cleanup:
                      print(f"Simulator cleanup problem: {cleanup}", flush=True)
                  if candidate_udid in created_udids:
                      try:
                          run(
                              ["xcrun", "simctl", "delete", candidate_udid],
                              timeout=15, check=False,
                          )
                      except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as cleanup:
                          print(f"Simulator deletion problem: {cleanup}", flush=True)
                  return None

          # Reusing preinstalled devices is fast on healthy runners, but two
          # consecutive simctl bootstatus timeouts must not abort screenshot QA
          # before trying a fresh simulator with the selected iOS runtime.
          for spec in candidate_specs:
              udid = prepare_simulator(spec)
              if udid:
                  break

          if not udid and existing_devices:
              print("Preinstalled iPhone simulators stalled; creating a fresh fallback.", flush=True)
              try:
                  device_type = candidates[0]
                  fresh_udid = run(
                      [
                          "xcrun", "simctl", "create", "RasporedDocsFresh",
                          device_type["identifier"], runtime["identifier"],
                      ],
                      timeout=45,
                  ).stdout.strip()
                  if not fresh_udid:
                      raise RuntimeError("simctl create returned an empty UDID")
                  created_udids.add(fresh_udid)
                  udid = prepare_simulator(
                      (fresh_udid, "fresh " + device_type["name"], False),
                      wait_seconds=210,
                  )
              except (subprocess.TimeoutExpired, subprocess.CalledProcessError,
                      RuntimeError) as exc:
                  boot_errors.append(f"fresh device: {type(exc).__name__}: {exc}")

          if not udid:
              detail = " | ".join(boot_errors)
              raise SystemExit(
                  "No iPhone Simulator finished boot; real screenshot QA remains required. "
                  + detail
              )

          # A fresh iOS runtime needs to initialize installd / SpringBoard
          # after bootstatus returns. One cold install can exceed 45 seconds.
          installed = False
          for install_attempt in range(1, 3):
              try:
                  run(
                      ["xcrun", "simctl", "install", udid, app],
                      timeout=180,
                  )
                  installed = True
                  break
              except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as exc:
                  print(
                      f"Simulator install attempt {install_attempt} failed: {exc}",
                      flush=True,
                  )
                  time.sleep(6)
          if not installed:
              raise SystemExit("iOS app install failed after two attempts")

          try:
              run(
                  [
                      "xcrun", "simctl", "status_bar", udid, "override",
                      "--time", "09:41",
                      "--batteryState", "charged",
                      "--batteryLevel", "100",
                      "--wifiBars", "3",
                      "--cellularBars", "4",
                  ],
                  timeout=15,
              )
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
              print("Status bar override skipped.", flush=True)

          def launch_screen(screen, first_screen):
              # CoreSimulator may report booted and accept install while
              # SpringBoard is still warming up. A transient launch timeout
              # must not fail the entire screenshot suite immediately.
              # Avoid the process-termination query on the very first launch.
              attempts = 3 if first_screen else 2
              failures = []
              for attempt in range(1, attempts + 1):
                  command = ["xcrun", "simctl", "launch"]
                  if not (first_screen and attempt == 1):
                      command.append("--terminate-running-process")
                  command.extend([
                      udid, bundle_id, "--documentation-screen", screen,
                  ])
                  try:
                      run(command, timeout=65 if attempt == 1 else 90)
                      return
                  except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as exc:
                      failures.append(f"attempt {attempt}: {type(exc).__name__}: {exc}")
                      print(
                          f"Simulator launch failed for {screen} on "
                          f"attempt {attempt}/{attempts}: {exc}",
                          flush=True,
                      )
                      if attempt < attempts:
                          # Check SpringBoard readiness again after the timeout.
                          # Never let a diagnostic command hide the real failure.
                          try:
                              run(
                                  ["xcrun", "simctl", "bootstatus", udid, "-b"],
                                  timeout=35,
                              )
                          except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as recovery:
                              print(f"Simulator recovery check: {recovery}", flush=True)
                          time.sleep(8)
              raise SystemExit(
                  f"Could not launch app for {screen} after {attempts} attempts. "
                  + " | ".join(failures)
              )

          def recover_first_launch():
              global udid
              # A simulator can boot and install successfully while SpringBoard
              # never completes simctl launch. Do not retry the same broken
              # device indefinitely: use another installed iPhone, then a
              # newly-created simulator. Screenshots remain mandatory.
              first_udid = udid
              try:
                  launch_screen("month", first_screen=True)
                  return
              except SystemExit as first_error:
                  print(f"First simulator could not launch the app: {first_error}", flush=True)

              alternatives = [
                  (candidate_udid, candidate_name, already_booted)
                  for candidate_udid, candidate_name, already_booted in candidate_specs
                  if candidate_udid != first_udid
              ]
              if candidates:
                  device_type = candidates[0]
                  try:
                      fresh_udid = run(
                          [
                              "xcrun", "simctl", "create", "RasporedDocsRecovery",
                              device_type["identifier"], runtime["identifier"],
                          ],
                          timeout=45,
                      ).stdout.strip()
                      if fresh_udid:
                          created_udids.add(fresh_udid)
                          alternatives.append((fresh_udid, "fresh " + device_type["name"], False))
                  except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as exc:
                      print(f"Could not create fallback simulator: {exc}", flush=True)

              failures = [f"initial device {first_udid} could not launch app"]
              for alternative_udid, alternative_name, already_booted in alternatives:
                  print(f"Retrying screenshot QA on {alternative_name} ({alternative_udid})", flush=True)
                  try:
                      if not already_booted:
                          run(["xcrun", "simctl", "boot", alternative_udid], timeout=60)
                      run(
                          ["xcrun", "simctl", "bootstatus", alternative_udid, "-b"],
                          timeout=210,
                      )
                      run(
                          ["xcrun", "simctl", "install", alternative_udid, app],
                          timeout=180,
                      )
                      # Only update the active target after the alternate
                      # device has completed boot and app installation.
                      udid = alternative_udid
                      try:
                          run(
                              [
                                  "xcrun", "simctl", "status_bar", udid, "override",
                                  "--time", "09:41", "--batteryState", "charged",
                                  "--batteryLevel", "100", "--wifiBars", "3",
                                  "--cellularBars", "4",
                              ],
                              timeout=15,
                          )
                      except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
                          print("Status bar override skipped on fallback.", flush=True)
                      launch_screen("month", first_screen=True)
                      try:
                          run(
                              ["xcrun", "simctl", "shutdown", first_udid],
                              timeout=12, check=False,
                          )
                      except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
                          print("Original simulator shutdown timed out.", flush=True)
                      return
                  except (
                      SystemExit, subprocess.TimeoutExpired, subprocess.CalledProcessError
                  ) as exc:
                      failures.append(f"{alternative_name}: {type(exc).__name__}: {exc}")
                      print(f"Fallback simulator failed: {exc}", flush=True)

              raise SystemExit(
                  "Screenshot QA failed: no simulator could launch the real app. "
                  + " | ".join(failures)
              )

          for index, screen in enumerate(screens):
              if index == 0:
                  recover_first_launch()
              else:
                  launch_screen(screen, first_screen=False)
              time.sleep(2)

              destination = output_dir / f"{screen}.png"
              captured = False
              for attempt in range(1, 4):
                  try:
                      run(
                          [
                              "xcrun", "simctl", "io", udid, "screenshot",
                              "--type=png", str(destination),
                          ],
                          timeout=20,
                      )
                      if destination.is_file() and destination.stat().st_size > 0:
                          # A valid PNG can still be a completely white
                          # CoreSimulator transition frame; treat it as failed.
                          run([validator, str(destination)], timeout=20)
                          captured = True
                          break
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                      print(f"Screenshot attempt {attempt} failed for {screen}: {exc}", flush=True)
                      if attempt < 3:
                          launch_screen(screen, first_screen=False)
                  time.sleep(2)

              if not captured:
                  raise SystemExit(f"Could not capture {screen} screenshot")

          for required in ("month", "year", "settings"):
              path = output_dir / f"{required}.png"
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing required screenshot: {path}")

          run(["xcrun", "simctl", "shutdown", udid], timeout=20, check=False)
          if udid in created_udids:
              run(["xcrun", "simctl", "delete", udid], timeout=20, check=False)
          PY
      - name: Upload real app screenshots
        if: steps.capture_screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raspored-real-screenshots
          path: ios/documentation-screenshots/*.png
          if-no-files-found: error
      - name: Archive for iOS device without signing
        run: >
          xcodebuild
          -project ios/Raspored.xcodeproj
          -scheme Raspored
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath ios/build-device/Raspored.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive
      - name: Package iOS artifacts
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SIM_APP="ios/build-simulator/Build/Products/Debug-iphonesimulator/Raspored.app"
          ARCHIVE="ios/build-device/Raspored.xcarchive"
          DEVICE_APP="$ARCHIVE/Products/Applications/Raspored.app"
          test -d "$SIM_APP"
          test -d "$ARCHIVE"
          test -d "$DEVICE_APP"
          mkdir -p ios/dist/Payload
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" "ios/dist/Raspored-${VERSION}-Simulator.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" "ios/dist/Raspored-${VERSION}-unsigned.xcarchive.zip"
          ditto "$DEVICE_APP" ios/dist/Payload/Raspored.app
          (cd ios/dist && zip -qry "Raspored-${VERSION}-unsigned.ipa" Payload)
          rm -rf ios/dist/Payload
      - uses: actions/upload-artifact@v4
        with:
          name: shifterica-ios
          path: ios/dist/*
          if-no-files-found: error
      # Screenshots are mandatory CI artifacts. The CI bot must never push
      # generated changes back into the PR: that creates an untrusted bot
      # commit with action_required checks and invalidates the green SHA.

  # CoreSimulator can stop accepting launch/bootstatus requests after the
  # original app's nine real-screen QA captures on GitHub-hosted macOS.
  # Build and launch the separate calendar on its OWN fresh macOS runner,
  # instead of inheriting the exhausted CoreSimulator and installed apps.
  # This is an additional mandatory job, not a skipped screenshot check.
  ios_calendar:
    name: Independent calendar iOS builds
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify current App Store SDK for calendar
        shell: bash
        run: |
          set -euo pipefail
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          [[ "$version" == Xcode\ 26* ]] || { echo 'Xcode 26 is required'; exit 1; }
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iPhoneOS SDK %s\n' "$sdk"
          [[ "${sdk%%.*}" == "26" ]] || { echo 'iOS 26 SDK is required'; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Universal calendar iOS regression tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library kalendar/ios/RasporedApp/CalendarEntry.swift kalendar/ios/RasporedApp/CalendarBackup.swift kalendar/ios/RasporedApp/CalendarSearch.swift kalendar/ios/tests/main.swift \
            -o "${RUNNER_TEMP}/raspored-universal-tests"
          "${RUNNER_TEMP}/raspored-universal-tests"
      - name: Generate universal calendar branded icon
        run: >
          xcrun --sdk macosx swift ios/generate_app_icon.swift
          kalendar/ios/RasporedApp/Assets.xcassets/AppIcon.appiconset/RasporedAppIcon-1024.png
      - name: Generate universal calendar Xcode project
        run: xcodegen generate --spec kalendar/ios/project.yml
      - name: Build universal calendar for iOS Simulator
        run: >
          xcodebuild
          -project kalendar/ios/RasporedUniversalCalendar.xcodeproj
          -scheme Raspored_app
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath kalendar/ios/build-simulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compile real screenshot content validator
        shell: bash
        run: swiftc -O scripts/verify-ios-real-screenshot.swift -o "$RUNNER_TEMP/verify-ios-real-screenshot"
      - name: Universal calendar simulator launch and real screenshots
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time

          validator = os.path.join(os.environ["RUNNER_TEMP"], "verify-ios-real-screenshot")
          app = "kalendar/ios/build-simulator/Build/Products/Debug-iphonesimulator/Raspored_app.app"
          if not pathlib.Path(app).is_dir():
              raise SystemExit("Universal iOS simulator app missing")
          def run(*args, timeout=90):
              return subprocess.run(args, capture_output=True, text=True,
                                    check=True, timeout=timeout).stdout
          runtimes = json.loads(run("xcrun","simctl","list","runtimes","available","-j",
                                    timeout=30))["runtimes"]
          # xrOS and tvOS can share version 26.x; never pass their runtime
          # identifiers to an iPhone simulator (simctl create exits 147).
          compatible = [
              r for r in runtimes
              if r.get("isAvailable")
              and r.get("name", "").startswith("iOS ")
              and "SimRuntime.iOS-" in r.get("identifier", "")
              and str(r.get("version", "")).startswith("26.")
          ]
          if not compatible:
              raise SystemExit("Xcode 26 requires an available iOS 26 simulator runtime")
          runtime = sorted(compatible, key=lambda r:tuple(
              int(part) for part in r["version"].split(".")
          ))[-1]
          print("Using iOS simulator runtime:", runtime["name"],
                runtime["identifier"], flush=True)
          by_runtime = json.loads(run("xcrun","simctl","list","devices","available","-j",
                                      timeout=30))["devices"]
          # Same model as original iOS runner; arbitrary devices change pixels.
          devices = [d for d in by_runtime.get(runtime["identifier"], [])
                     if d.get("isAvailable") and d.get("name") == "iPhone 17 Pro"]
          if devices:
              target = devices[0]
              udid = target["udid"]
          else:
              types = json.loads(run("xcrun","simctl","list","devicetypes","-j",
                                     timeout=30))["devicetypes"]
              device = next((d for d in types if d.get("name") == "iPhone 17 Pro"), None)
              if device is None:
                  raise SystemExit("iPhone 17 Pro simulator is required for pixel parity")
              udid = run("xcrun","simctl","create","RasporedUniversalQA",
                         device["identifier"],runtime["identifier"],timeout=40).strip()
              target = {"state":"Shutdown"}
          # Simulator launch can hang after successful boot and install on hosted
          # macOS runners. Require a real launch and screenshot; retry on a
          # second iPhone or a newly created device rather than marking QA green.
          def prepare(candidate, state):
              if state != "Booted":
                  run("xcrun","simctl","boot",candidate,timeout=60)
              run("xcrun","simctl","bootstatus",candidate,"-b",timeout=240)
              run("xcrun","simctl","install",candidate,app,timeout=120)

          def launch(candidate):
              for attempt in range(2):
                  try:
                      print("Launching Raspored_app on",candidate,
                            "attempt",attempt + 1,flush=True)
                      run("xcrun","simctl","launch",candidate,
                          "hr.raspored.kalendar",
                          timeout=65 if attempt == 0 else 95)
                      return True
                  except (subprocess.TimeoutExpired,
                          subprocess.CalledProcessError) as exc:
                      print("Simulator launch failed:",repr(exc),flush=True)
                      if attempt == 0:
                          try:
                              run("xcrun","simctl","bootstatus",candidate,"-b",
                                  timeout=60)
                          except (subprocess.TimeoutExpired,
                                  subprocess.CalledProcessError) as recovery:
                              print("Readiness retry failed:",repr(recovery),flush=True)
              return False

          # Hosted CoreSimulator can boot successfully but hang on simctl
          # install. Treat install timeouts like launch failures and retry
          # on another REAL simulator of the SAME model. Never synthesize QA.
          def prepare_and_launch(candidate, state):
              try:
                  print("Preparing universal calendar simulator:", candidate,
                        "state:", state, flush=True)
                  prepare(candidate, state)
                  return launch(candidate)
              except (subprocess.TimeoutExpired,
                      subprocess.CalledProcessError) as exc:
                  print("Simulator boot/install failed:", repr(exc), flush=True)
                  return False

          if not prepare_and_launch(udid, target.get("state", "Shutdown")):
              alternatives = [
                  (d["udid"], d.get("state", "Shutdown"))
                  for d in devices if d["udid"] != udid
              ][:1]
              # Include a clean device even if preinstalled simulators stall.
              # The model must remain identical for 1:1 screenshot comparison.
              try:
                  types = json.loads(
                      run("xcrun", "simctl", "list", "devicetypes",
                          "-j", timeout=30)
                  )["devicetypes"]
                  chosen = next(
                      (d for d in types if d.get("name") == "iPhone 17 Pro"),
                      None
                  )
                  if chosen is None:
                      raise RuntimeError("iPhone 17 Pro unavailable for recovery")
                  fresh = run(
                      "xcrun", "simctl", "create",
                      "RasporedUniversalRecovery", chosen["identifier"],
                      runtime["identifier"], timeout=45
                  ).strip()
                  if fresh:
                      alternatives.append((fresh, "Shutdown"))
              except (subprocess.TimeoutExpired,
                      subprocess.CalledProcessError, KeyError, RuntimeError) as exc:
                  print("Fallback device creation unavailable:", repr(exc), flush=True)
              recovered = False
              for alternative, state in alternatives:
                  if prepare_and_launch(alternative, state):
                      udid = alternative
                      recovered = True
                      break
              if not recovered:
                  raise SystemExit(
                      "Universal calendar could not install and launch on any "
                      "iPhone 17 Pro simulator; screenshot QA remains mandatory"
                  )
          out = pathlib.Path("kalendar/ios/real-screenshots")
          out.mkdir(parents=True,exist_ok=True)
          # Capture the actual installed application on every primary screen;
          # DEBUG-only initial routes are not included in device archives.
          screens = [
              ("calendar", None),
              ("year", "--qa-calendar-year"),
              ("summary", "--qa-calendar-summary"),
              ("settings", "--qa-calendar-settings"),
              ("shifts", "--qa-calendar-shifts"),
              ("new-shift", "--qa-calendar-new-shift"),
              ("search", "--qa-calendar-search"),
              ("day-picker", "--qa-calendar-day-picker"),
              ("splash", "--qa-calendar-splash"),
          ]
          # simctl terminate can wedge for >30s on GitHub hosted macOS
          # runners even after two valid screenshots. Avoid a separate
          # terminate RPC: launch --terminate-running-process performs one
          # atomic app restart with the required DEBUG route arguments.
          # A stuck CoreSimulator is recovered on a fresh *real* simulator,
          # never by skipping a screenshot or accepting an empty placeholder.
          def screen_launch(candidate, route, fresh=False):
              args = ["xcrun", "simctl", "launch"]
              if not fresh:
                  args.append("--terminate-running-process")
              args.extend([candidate, "hr.raspored.kalendar"])
              if route is not None:
                  args.extend([route, "--qa-calendar-nosplash"])
              run(*args, timeout=95)

          def fresh_device():
              types = json.loads(run("xcrun", "simctl", "list",
                                     "devicetypes", "-j", timeout=40))["devicetypes"]
              chosen = next((item for item in types
                             if item.get("name") == "iPhone 17 Pro"), None)
              if chosen is None:
                  raise SystemExit("iPhone 17 Pro unavailable for screenshot recovery")
              created = run("xcrun", "simctl", "create",
                            "RasporedScreenRecovery",
                            chosen["identifier"], runtime["identifier"],
                            timeout=50).strip()
              prepare(created, "Shutdown")
              return created

          seen_images = set()
          for name, route in screens:
              path = out / (name + ".png")
              captured = False
              for attempt in range(2):
                  try:
                      # Initial calendar screen is already launched above.
                      if route is not None or attempt > 0:
                          screen_launch(udid, route)
                      time.sleep(3)
                      run("xcrun", "simctl", "io", udid,
                          "screenshot", "--type=png", str(path), timeout=70)
                      # Do not accept a white unrendered frame as a UI capture.
                      run(validator, str(path), timeout=20)
                      captured = True
                      break
                  except (subprocess.TimeoutExpired,
                          subprocess.CalledProcessError) as exc:
                      print(f"Simulator {name} attempt {attempt + 1} failed:",
                            repr(exc), flush=True)
              if not captured:
                  print("Recovering real", name,
                        "screenshot on a new iPhone simulator", flush=True)
                  udid = fresh_device()
                  screen_launch(udid, route, fresh=True)
                  time.sleep(4)
                  run("xcrun", "simctl", "io", udid, "screenshot",
                      "--type=png", str(path), timeout=90)
                  run(validator, str(path), timeout=20)
              if path.stat().st_size < 8192:
                  raise SystemExit(f"Missing/empty real {name} screenshot")
              import struct
              with path.open("rb") as screenshot:
                  header = screenshot.read(24)
              if header[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{name} screenshot is not PNG")
              width,height = struct.unpack(">II",header[16:24])
              if min(width,height) < 300:
                  raise SystemExit(f"{name} screenshot dimensions invalid")
              import hashlib
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest in seen_images:
                  raise SystemExit(f"{name} screenshot duplicated a previous screen")
              seen_images.add(digest)
              print("Real calendar screenshot verified:",name,width,height,flush=True)
          PY
      - name: Upload universal calendar screenshot
        uses: actions/upload-artifact@v4
        with:
          name: raspored-universal-real-screenshot
          path: kalendar/ios/real-screenshots/*.png
          if-no-files-found: error
      - name: Archive universal calendar for iOS device without signing
        run: >
          xcodebuild
          -project kalendar/ios/RasporedUniversalCalendar.xcodeproj
          -scheme Raspored_app
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath kalendar/ios/build-device/Raspored_app.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive
      - name: Package universal calendar iOS assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SIM="kalendar/ios/build-simulator/Build/Products/Debug-iphonesimulator/Raspored_app.app"
          ARCHIVE="kalendar/ios/build-device/Raspored_app.xcarchive"
          DEVICE="$ARCHIVE/Products/Applications/Raspored_app.app"
          test -d "$SIM"
          test -d "$ARCHIVE"
          test -d "$DEVICE"
          mkdir -p kalendar/ios/dist/Payload
          ditto -c -k --sequesterRsrc --keepParent "$SIM" "kalendar/ios/dist/Raspored_app-${VERSION}-Simulator.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" "kalendar/ios/dist/Raspored_app-${VERSION}-unsigned.xcarchive.zip"
          ditto "$DEVICE" kalendar/ios/dist/Payload/Raspored_app.app
          (cd kalendar/ios/dist && zip -qry "Raspored_app-${VERSION}-unsigned.ipa" Payload)
          rm -rf kalendar/ios/dist/Payload
          test -s "kalendar/ios/dist/Raspored_app-${VERSION}-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: shifterica-universal-ios
          path: kalendar/ios/dist/*
          if-no-files-found: error

  ios_visual_parity:
    name: iOS screenshot visual parity
    needs: [ios, ios_calendar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible screenshot comparator
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify white-frame and pixel-difference regressions
        run: python scripts/test-ios-screenshot-parity.py
      - uses: actions/download-artifact@v4
        with:
          name: raspored-real-screenshots
          path: screenshots/raspored
      - uses: actions/download-artifact@v4
        with:
          name: raspored-universal-real-screenshot
          path: screenshots/kalendar
      - name: Compare five genuine shared iOS screens
        run: >
          python scripts/verify-ios-screenshot-parity.py
          --raspored screenshots/raspored
          --kalendar screenshots/kalendar

  release:
    name: GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, ios, ios_calendar, ios_visual_parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"

          if ! grep -Fq "## $VERSION" CHANGELOG.md; then
            echo "Release notes missing from CHANGELOG.md for $VERSION" >&2
            exit 1
          fi
          {
            printf '# SHIFTERICA / Raspored %s\n\n' "$TAG"
            printf '%s\n\n' 'Android and iOS — two independently installable calendar applications.'
            awk -v version="$VERSION" '
              index($0, "## " version) == 1 { reading=1; next }
              reading && /^## / { exit }
              reading { print }
            ' CHANGELOG.md
            printf '\n%s\n\n' '## Included QA packages'
            printf '%s\n' '- Raspored: Android debug APK and AAB, iOS Simulator app ZIP, unsigned IPA and unsigned XCArchive ZIP.'
            printf '%s\n\n' '- Raspored_app: Android debug APK and AAB, iOS Simulator app ZIP, unsigned IPA and unsigned XCArchive ZIP.'
            printf '%s\n' '**Signing:** Android packages are debug builds; iOS device packages are unsigned. Store distribution requires production signing credentials and store review.'
          } > release-notes.md

          ASSETS=(
            release-artifacts/shifterica-android/*
            release-artifacts/shifterica-ios/*
            release-artifacts/shifterica-universal-ios/*
          )

          # All five package formats for both apps must exist and be nonempty.
          REQUIRED=(
            "Raspored-${VERSION}-debug.apk"
            "Raspored-${VERSION}-debug.aab"
            "Raspored-${VERSION}-Simulator.app.zip"
            "Raspored-${VERSION}-unsigned.ipa"
            "Raspored-${VERSION}-unsigned.xcarchive.zip"
            "Raspored_app-${VERSION}-debug.apk"
            "Raspored_app-${VERSION}-debug.aab"
            "Raspored_app-${VERSION}-Simulator.app.zip"
            "Raspored_app-${VERSION}-unsigned.ipa"
            "Raspored_app-${VERSION}-unsigned.xcarchive.zip"
          )
          for name in "${REQUIRED[@]}"; do
            count=0
            matched_asset=""
            for asset in "${ASSETS[@]}"; do
              if [[ "${asset##*/}" == "$name" ]]; then
                test -s "$asset"
                matched_asset="$asset"
                count=$((count + 1))
              fi
            done
            if [[ "$count" -ne 1 ]]; then
              echo "Missing or duplicated release asset: $name" >&2
              exit 1
            fi

            # Verify ZIP integrity and each platform's required package manifest.
            unzip -tqq "$matched_asset"
            case "$name" in
              *.apk) manifest='^AndroidManifest[.]xml$' ;;
              *.aab) manifest='^base/manifest/AndroidManifest[.]xml$' ;;
              *-Simulator.app.zip) manifest='(^|/)[^/]+[.]app/Info[.]plist$' ;;
              *-unsigned.ipa) manifest='^Payload/[^/]+[.]app/Info[.]plist$' ;;
              *-unsigned.xcarchive.zip) manifest='(^|/)[^/]+[.]xcarchive/Info[.]plist$' ;;
              *) echo "Unexpected package format: $name" >&2; exit 1 ;;
            esac
            unzip -Z1 "$matched_asset" | awk -v pattern="$manifest" '
              $0 ~ pattern { found=1 }
              END { if (!found) exit 1 }
            '
          done
          # GitHub Releases are immutable in meaning: never silently replace
          # assets or notes under an already published version number.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving published assets. Increase VERSION for a new release."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a release; refusing to overwrite or retarget it." >&2
            exit 1
          fi
          gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Raspored $TAG" --notes-file release-notes.md
