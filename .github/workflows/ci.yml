name: CI\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\nconcurrency:\n  group: ci-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  android:\n    name: Android build\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: android\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n      - uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '8.13'\n      - name: Unit tests\n        run: gradle :app:testDebugUnitTest --stacktrace\n      - name: Build debug APK\n        run: gradle :app:assembleDebug --stacktrace\n      - name: Verify APK\n        run: test -f app/build/outputs/apk/debug/app-debug.apk\n      - uses: actions/upload-artifact@v4\n        with:\n          name: shifterica-android-debug\n          path: android/app/build/outputs/apk/debug/app-debug.apk\n          if-no-files-found: error\n\n  ios:\n    name: iOS simulator build\n    runs-on: macos-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Install XcodeGen\n        run: brew install xcodegen\n      - name: Generate Xcode project\n        run: xcodegen generate --spec ios/project.yml\n      - name: Build for simulator\n        run: xcodebuild -project ios/Raspored.xcodeproj -scheme Raspored -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build\n