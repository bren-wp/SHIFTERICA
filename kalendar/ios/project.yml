name: RasporedUniversalCalendar
options:
  bundleIdPrefix: hr.raspored
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 1.13.32
    CURRENT_PROJECT_VERSION: 52
    PRODUCT_BUNDLE_IDENTIFIER: hr.raspored.kalendar
    INFOPLIST_KEY_CFBundleDisplayName: Raspored_app
targets:
  Raspored_app:
    type: application
    platform: iOS
    sources:
      - path: RasporedApp
    settings:
      base:
        PRODUCT_NAME: Raspored_app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: RasporedApp/Info.plist
      properties:
        CFBundleDisplayName: Raspored_app
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
